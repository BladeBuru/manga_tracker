# Nginx config — Manga Tracker Web (Flutter)
#
# Servi par NPMplus en amont (TrueNAS NAS) qui gère HTTPS pour app.bladeburu.com.
# Ce container écoute en HTTP simple sur le port 80.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─────────────────────────────────────────────────────────────
    # Compression gzip — drastique sur les .js Flutter (4.3 MB → ~1 MB)
    # ─────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/wasm
        application/xml
        application/xml+rss
        font/woff
        font/woff2
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # ─────────────────────────────────────────────────────────────
    # Headers de sécurité (CSP permissif pour Flutter CanvasKit + Google OAuth)
    # ─────────────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # CSP : autorise CanvasKit + Google OAuth + l'API en HTTPS
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline' https://www.gstatic.com https://accounts.google.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' data: https://fonts.gstatic.com;
        img-src 'self' data: blob: https: http:;
        connect-src 'self' https://api.bladeburu.com https://accounts.google.com https://www.googleapis.com https://cdn.mangaupdates.com;
        frame-src 'self' https://accounts.google.com;
        worker-src 'self' blob:;
        object-src 'none';
        base-uri 'self';
    " always;

    # ─────────────────────────────────────────────────────────────
    # CACHE — aucun fichier d'un build Flutter web n'a de hash dans son nom
    # (main.dart.js, flutter.js, *.part.js, police d'icônes réduite à chaque
    # build, AssetManifest…). Un cache long (« 30 j immutable », avant
    # 2026-10) servait donc d'anciens fichiers après une mise à jour.
    # Règle : tout est REVALIDÉ à chaque chargement (`no-cache` → requête
    # conditionnelle, 304 si inchangé grâce à ETag / Last-Modified) ; le
    # cœur de l'application n'est jamais stocké (`no-store`). Seuls les
    # images et `canvaskit/` (lié à la version du moteur Flutter) gardent un
    # cache court, sans `immutable`.
    #
    # ⚠️ `add_header` dans un `location` remplace TOUS les `add_header` du
    # niveau `server` : les en-têtes de sécurité ci-dessus ne partent donc
    # pas avec ces réponses (constaté en prod : nosniff / X-Frame-Options y
    # sont ajoutés en amont, pas de CSP). Ne pas « réparer » à l'aveugle : la
    # CSP actuelle bloquerait CanvasKit et Google Fonts (connect-src) — cf.
    # deploy/web/README.md.
    # `location =` (correspondance exacte) prime sur toutes les regex.
    # ─────────────────────────────────────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }
    location = /main.dart.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri =404;
    }
    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    # Interrupteur d'arrêt de l'ancien service worker : toujours relu.
    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    # Lu par l'application pour proposer « Recharger » après un déploiement.
    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }
    location = /flutter.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Assets Flutter (manifestes JSON, polices, images, shaders) : revalidés.
    location ^~ /assets/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;

        # .env de Flutter (chargés par flutter_dotenv au runtime).
        location ~ ^/assets/assets/env/\.env\. {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            try_files $uri =404;
        }
    }

    # CanvasKit : change avec la version du moteur Flutter → 1 jour.
    location ^~ /canvaskit/ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Images hors assets (icônes PWA, favicon) : 1 jour, sans immutable.
    location ~* \.(?:png|jpg|jpeg|gif|svg|webp|ico)$ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Tout autre script, style, police ou wasm (dont les morceaux différés
    # `main.dart.js_N.part.js`) : revalidé.
    location ~* \.(?:js|mjs|css|wasm|woff2?|ttf|otf)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # ─────────────────────────────────────────────────────────────
    # SPA fallback — toute URL de l'application (`/manga/12`, `/library`…)
    # retombe sur index.html (go_router + URL réelles, `usePathUrlStrategy`).
    # ─────────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Healthcheck léger
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
